# Shared Hydra defaults. Per-run settings live in config/run/*.yaml and are
# selected with `run=<run_id>` on the command line.

defaults:
  - _self_
  - run: ???  # loads from config/run/, accessible as 'run=' in CLI

# Execution mode: sanity, pilot, or full
mode: full

# Results output directory
results_dir: .research/results

wandb:
  entity: airas
  project: cgpli-plinder
  mode: online

experiment:
  seed: 42
  cache_dir: .cache

  # Evaluation-set size per mode. sanity is synthetic and needs no network;
  # pilot and full pull real PLINDER systems from the public bucket.
  n_systems_sanity: 4
  n_systems_pilot: 20
  # 150 systems out of the 346 in the MLSB subset, which is the size the
  # original brief asked for (150-200). There is no execution-time reason to
  # stop here: an earlier batch died at ~31 minutes, but that was a rolling
  # deploy of the executor's workers, not a duration limit.
  n_systems_full: 150

  # Shard downloads are latency-bound; fetching them serially took over half
  # an hour on its own, which dominated the wall clock.
  download_workers: 12

  # Orientation search budget for the blackhole_busted adversary. This is the
  # predictor that actively maximises lDDT-PLI, so the budget is how hard the
  # adversary is allowed to try.
  n_orientations: 16

  # PoseBusters supplies the validity gate. Disable only for debugging.
  posebusters: true

  n_bootstrap: 1000
